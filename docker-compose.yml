services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stepfree}
      POSTGRES_USER: ${DB_USERNAME:-stepfree}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stepfree}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP server that catches every email. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
