spring:
  application:
    name: stepfree-london
  # Lets `./mvnw spring-boot:run` pick up the repo-root .env without exporting variables by hand.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stepfree}
    username: ${DB_USERNAME:stepfree}
    password: ${DB_PASSWORD:stepfree}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it.
    properties:
      # Loads lazy collections (route lines/stations) for many saved journeys in one query, not N.
      hibernate.default_batch_fetch_size: 50
  session:
    jdbc:
      initialize-schema: never   # V1 migration creates the Spring Session tables.
    timeout: 7d
  mail:
    # Mailpit (docker-compose) locally: catches every message, UI on http://localhost:8025.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # true in production (HTTPS). False locally so the cookie works on http://localhost.
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # An unreachable SMTP server must not mark the whole app DOWN; failed emails are retried.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

stepfree:
  tfl:
    base-url: https://api.tfl.gov.uk
    app-key: ${TFL_APP_KEY:}
    connect-timeout: 3s
    read-timeout: 8s
    max-attempts: 2
    initial-backoff: 250ms
  cache:
    station-search-ttl: 24h
    line-status-ttl: 60s
    journey-ttl: 60s
    station-info-ttl: 12h
    disruption-ttl: 60s
    lift-status-ttl: 120s
    stale-max-age: 6h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # Failed logins allowed per window before further attempts are refused with 429.
    max-failures-per-email: 5
    max-failures-per-ip: 50
    failure-window: 15m
  saved-journeys:
    max-per-user: 50
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    interval: ${MONITORING_INTERVAL:2m}
    initial-delay: 30s
    resolved-retention: 90d
    run-retention: 30d
    # Enables POST /internal/monitoring/run for an external scheduler. Use a long random value.
    trigger-token: ${MONITORING_TRIGGER_TOKEN:}
  notifications:
    from-address: ${MAIL_FROM:alerts@stepfree.local}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    retry-backoff: 1m,5m,30m
    batch-size: 50
    stuck-after: 10m
